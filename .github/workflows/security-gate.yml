name: AI security gate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  security-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite
          coverage: none
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Validate Composer configuration
        run: composer validate --strict
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-security-blocking
      - name: Build frontend assets
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Report Laravel 8 dependency advisories
        continue-on-error: true
        run: composer audit --locked
      - name: Configure application
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Run complete test suite
        run: php artisan test
      - name: Verify security routes
        run: php artisan route:list --path=security
      - name: Verify vulnerable-to-remediated proof
        run: php artisan arena:demo-security --json
